<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LaunchForge | ChurchBuilt</title>
  <meta name="description" content="A premium ChurchBuilt creative launch simulator that recommends websites, branding, video, photos, music, QR promo, content, or full creative launch support." />
  <link rel="stylesheet" href="style-v9.css?v=9" />
</head>
<body>
  <div class="fx-grain"></div>
  <div class="fx-vignette"></div>

  <main class="app">
    <header class="hud">
      <div class="brand">
        <div class="brand-badge">CB</div>
        <div>
          <strong>ChurchBuilt</strong>
          <small>Creative launch partner</small>
        </div>
      </div>

      <div>
        <div class="hud-label" id="hudLabel">SYSTEM READY</div>
        <div class="progress-track"><i id="progress"></i></div>
      </div>

      <div class="hud-count" id="hudCount">00 / 08</div>
    </header>

    <section class="stage" id="stage">
      <div class="loading">Loading LaunchForge...</div>
    </section>
  </main>

  <script src="script-v9.js?v=9" defer></script>
</body>
</html>
