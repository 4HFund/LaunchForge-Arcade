<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LaunchForge Arcade | ChurchBuilt</title>
  <meta name="description" content="A cinematic ChurchBuilt brand discovery game that recommends websites, branding, video, photos, music, QR promo, social content, or full creative launch support." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <div class="noise"></div>
  <div class="city-glow city-a"></div>
  <div class="city-glow city-b"></div>

  <main class="app">
    <header class="hud">
      <a class="brand" href="#" aria-label="LaunchForge Arcade home">
        <span class="brand-icon">CB</span>
        <span>
          <strong>ChurchBuilt</strong>
          <small>Creative launch intelligence</small>
        </span>
      </a>

      <div class="hud-center">
        <span id="hudLabel">SYSTEM READY</span>
        <div class="hud-line"><i id="progressBar"></i></div>
      </div>

      <div class="hud-meta">
        <span id="levelCount">00 / 08</span>
        <span>LAUNCHFORGE</span>
      </div>
    </header>

    <section id="screen" class="screen" aria-live="polite">
      <div class="loading-card">
        <div class="loader"></div>
        <p>Loading LaunchForge Arcade...</p>
      </div>
    </section>
  </main>

  <script src="script.js?v=4" defer></script>
</body>
</html>
